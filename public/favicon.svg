<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle / Rounded Box -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" />

  <!-- Stylized Nutrition Leaf / Health Emblem -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Main Leaf Shape -->
    <path d="M256 90 C340 90 410 160 410 250 C410 350 320 405 256 420 C192 405 102 350 102 250 C102 160 172 90 256 90 Z" fill="#ffffff" fill-opacity="0.96" />
    
    <!-- Inner Leaf Accent -->
    <path d="M256 125 C315 125 365 175 365 242 C365 315 300 355 256 370 C212 355 147 315 147 242 C147 175 197 125 256 125 Z" fill="url(#leafGrad)" />
    
    <!-- Stylized 'N' & Sprout Center -->
    <path d="M220 330 L220 185 L292 295 L292 185" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Tiny Organic Sun/Fruit Dot -->
    <circle cx="292" cy="155" r="14" fill="#ffca28" />
  </g>
</svg>